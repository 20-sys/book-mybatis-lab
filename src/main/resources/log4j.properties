# Console logging: only SQL matters day to day, everything else is pushed down to WARN.

log4j.rootLogger=WARN, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss} %-5p %c{1} - %m%n

# Mapper package at DEBUG so that "==> Preparing", "==> Parameters" and "<== Total" show up.
log4j.logger.com.campus.lib.mapper=DEBUG

# DataSource/Transaction chatter is noisy and useless while tuning SQL.
log4j.logger.org.apache.ibatis.datasource=WARN
log4j.logger.org.apache.ibatis.transaction=WARN
